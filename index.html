<title>ライフライン・設備 学習 | Lifeline &amp; Equipment</title>
<style>
:root{
  --navy:#0F2E52; --navy2:#2563EB; --navy2-dk:#1D4ED8;
  --ok:#16A34A; --ok-bg:#F0FDF4; --ng:#DC2626; --ng-bg:#FEF2F2;
  --warn:#F59E0B; --warn-bg:#FFFBEB;
  --bg:#F8FAFC; --card:#FFFFFF; --line:#E7ECF2;
  --ink:#0F172A; --sub:#64748B;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 4px 6px -1px rgba(15,23,42,.06), 0 2px 4px -2px rgba(15,23,42,.05);
  --shadow-lg:0 10px 20px -6px rgba(15,23,42,.10), 0 4px 8px -4px rgba(15,23,42,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",
    "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;
  line-height:1.6; font-size:16px;
  padding-bottom:env(safe-area-inset-bottom);
}
header{background:#fff;color:var(--ink);padding:12px 14px;position:sticky;top:0;z-index:10;
  border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(15,23,42,.03)}
@supports (padding-top: env(safe-area-inset-top)){
  header{padding-top:calc(12px + env(safe-area-inset-top))}
}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
header .logo{height:28px;width:auto;display:block;flex:0 0 auto}
header h1{margin:8px 0 0;font-size:16.5px;font-weight:700;letter-spacing:.02em;color:var(--sub)}
.langbtns{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px}
.langbtns button{border:0;background:transparent;color:var(--sub);font-size:13px;font-weight:700;
  padding:10px 12px;min-height:40px;border-radius:99px;cursor:pointer;font-family:inherit;transition:background .15s,color .15s}
.langbtns button[aria-pressed="true"]{background:#fff;color:var(--navy2);box-shadow:var(--shadow-sm)}
.hometabs{display:flex;gap:4px;background:#EEF2F7;border-radius:99px;padding:4px;margin-bottom:16px}
.hometabs button{flex:1;border:0;background:transparent;color:var(--sub);font-size:13.5px;font-weight:700;
  padding:10px 0;border-radius:99px;cursor:pointer;font-family:inherit;transition:background .15s,color .15s}
.hometabs button[aria-pressed="true"]{background:#fff;color:var(--navy2);box-shadow:var(--shadow-sm)}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 44px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px;
  margin-bottom:14px;box-shadow:var(--shadow-sm)}
.card.exam{border-color:#DBEAFE;box-shadow:var(--shadow-md)}
.lead{font-size:12.5px;color:var(--sub);margin:0 0 4px;letter-spacing:.03em;font-weight:600}
h2{font-size:18px;margin:0 0 4px;letter-spacing:.01em;color:var(--ink)}
.desc{font-size:13.5px;color:var(--sub);margin:6px 0 0}

.spec{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.spec div{flex:1;min-width:76px;background:var(--bg);border-radius:12px;padding:11px 10px;text-align:center}
.spec b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.spec span{font-size:10.5px;color:var(--sub)}

.stat{display:flex;gap:8px;margin:14px 0 4px}
.stat div{flex:1;background:var(--bg);border-radius:14px;padding:14px 10px;text-align:center}
.stat b{display:block;font-size:1.6rem;font-weight:800;letter-spacing:-.02em;color:var(--navy2);
  font-variant-numeric:tabular-nums;line-height:1.15}
.stat b small{font-size:.9rem;font-weight:700;color:var(--sub)}
.stat span{font-size:11px;color:var(--sub);font-weight:600}
.radargrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px;align-items:start}
.examgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.examgrid .card{padding:16px 13px}
.examgrid .spec{gap:6px}
.examgrid .spec div{min-width:0;padding:8px 4px}
.examgrid .spec b{font-size:15px}
.examgrid h2{font-size:16px}

.btn{display:block;width:100%;border:0;border-radius:10px;padding:15px;
  background:var(--navy2);color:#fff;font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer;
  margin-top:11px;box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .12s,background .12s}
.btn:hover{background:var(--navy2-dk);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn:active{transform:translateY(0)}
.btn:disabled{background:#CBD5E1;box-shadow:none;transform:none;cursor:default}
.btn.ghost{background:#fff;color:var(--navy2);border:1.5px solid #DBEAFE;box-shadow:none}
.btn.ghost:hover{background:#EFF6FF;border-color:var(--navy2)}
.btn.quiet{background:#fff;color:var(--sub);border:1.5px solid var(--line);font-weight:600;font-size:14px;padding:12px;box-shadow:none}
.btn.quiet:hover{background:var(--bg);transform:none;box-shadow:none}
.btn.warn{background:var(--warn);color:#78350F;padding:12px}
.btn.warn:hover{background:#D97706}
.sticky-next-spacer{height:78px}
.sticky-next{position:fixed;left:0;right:0;bottom:0;z-index:500;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, rgba(248,250,252,1) 60%, rgba(248,250,252,0));
}
.sticky-next .btn{max-width:612px;margin:0 auto;box-shadow:0 -2px 14px rgba(15,23,42,.12)}

.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
.cat{display:flex;flex-direction:column;gap:1px;align-items:flex-start;border:1.5px solid var(--line);
  background:#fff;border-radius:14px;padding:11px 13px;cursor:pointer;text-align:left;color:var(--ink);
  font-family:inherit;transition:border-color .12s,background .12s,transform .12s}
.cat:hover{border-color:#BFDBFE;transform:translateY(-1px)}
.cat[aria-pressed="true"]{border-color:var(--navy2);background:#EFF6FF}
.cat b{font-size:13.5px;font-weight:700}
.cat span{font-size:10.5px;color:var(--sub);font-weight:600}

.topbar{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.back{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--navy2);
  border-radius:99px;padding:6px 12px;font-family:inherit;font-size:13px;font-weight:700;
  cursor:pointer;line-height:1.4;white-space:nowrap;transition:background .12s}
.back:hover{background:var(--bg)}
.progbar{flex:1;height:6px;background:#E7ECF2;border-radius:99px;overflow:hidden}
.progbar i{display:block;height:100%;background:var(--navy2);border-radius:99px;transition:width .2s}
.progtxt{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;font-weight:700}
.progtxt.jumpbtn{background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:5px 10px;
  cursor:pointer;font-family:inherit;white-space:nowrap}
.jumppanel{background:#fff;border-radius:14px;padding:10px;margin-bottom:12px;
  box-shadow:var(--shadow-md);border:1px solid var(--line)}
.clock{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--bg);
  border:1px solid var(--line);border-radius:99px;padding:5px 11px;color:var(--navy)}
.clock.hurry{border-color:#FCA5A5;color:var(--ng);background:var(--ng-bg)}

.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;
  background:#EFF6FF;color:var(--navy2);border-radius:99px;padding:4px 10px;margin-bottom:10px}
.q-main{font-size:17.5px;font-weight:700;line-height:1.65;margin:0 0 6px;color:var(--ink)}
.qphoto{display:block;max-width:100%;max-height:160px;margin:0 auto 10px;border:1px solid var(--line);
  border-radius:12px;background:#fff;object-fit:contain}
ruby{ruby-align:center}
rt{font-size:0.55em;font-weight:400;color:var(--sub);user-select:none}
.q-main, .q-sub, .opt span, .q, .a, .e{line-height:1.55}
.q-sub{font-size:13.5px;color:var(--sub);margin:0;line-height:1.6}

.opts{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.opt{width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;
  padding:11px 12px;font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer;
  display:flex;gap:11px;align-items:flex-start;line-height:1.42;transition:border-color .12s,background .12s,transform .1s}
.opt:hover{border-color:#BFDBFE;transform:translateY(-1px)}
.opt .num{flex:0 0 24px;height:24px;border-radius:7px;background:var(--bg);color:var(--sub);
  display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px}
.opt .sub{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
.opt.picked{border-color:var(--navy2);background:#EFF6FF}
.opt.picked .num{background:var(--navy2);color:#fff}
.opt.correct{border-color:#BBF7D0;background:var(--ok-bg)}
.opt.correct .num{background:var(--ok);color:#fff}
.opt.wrong{border-color:#FECACA;background:var(--ng-bg)}
.opt.wrong .num{background:var(--ng);color:#fff}
.opt.dim{opacity:.5}

.verdict{margin-top:15px;border-radius:14px;padding:14px}
.verdict.ok{background:var(--ok-bg)}
.verdict.ng{background:var(--ng-bg)}
.verdict .head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14.5px;margin-bottom:6px}
.verdict.ok .head{color:var(--ok)}
.verdict.ng .head{color:var(--ng)}
.verdict .mark{font-size:19px;line-height:1}
.verdict p{margin:0 0 4px;font-size:14px;line-height:1.65}
.verdict .sub{font-size:12.5px;color:var(--sub);margin:0;line-height:1.65}

.nav{display:flex;gap:9px;margin-top:12px}
.nav button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:0}
.grid button{border:1.5px solid var(--line);background:#fff;border-radius:8px;aspect-ratio:1;max-width:44px;min-height:44px;
  font-family:inherit;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;font-variant-numeric:tabular-nums}
.grid button.done{border-color:var(--navy2);background:#EFF6FF;color:var(--navy2)}
.grid button.now{background:var(--navy2);border-color:var(--navy2);color:#fff}

.score{text-align:center;padding:6px 0 2px}
.score .big{font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.score .big small{font-size:19px;font-weight:700;color:var(--sub)}
.score .pct{font-size:13.5px;color:var(--sub);margin-top:6px}
.judge{display:inline-block;margin-top:12px;font-weight:800;font-size:14px;padding:7px 18px;border-radius:99px}
.judge.pass{background:var(--ok-bg);color:var(--ok)}
.judge.fail{background:var(--warn-bg);color:#92400E}

.rv{list-style:none;margin:0;padding:0}
.rv li{border-top:1px solid var(--line);padding:16px 0;background:#fff}
.rv li:first-child{border-top:0}
.rv .n{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;
  color:#fff;background:var(--navy2);padding:3px 10px 3px 8px;border-radius:99px;letter-spacing:.02em}
.rv .q{font-size:15px;font-weight:700;margin:9px 0 6px;line-height:1.6;color:var(--ink)}
.rv .a{font-size:13.5px;color:var(--ok);font-weight:700;margin:0;
  background:var(--ok-bg);border-radius:10px;padding:7px 11px;line-height:1.6}
.rv .a::before{content:"✓ "}
.rv .m{font-size:13px;color:var(--ng);font-weight:700;margin:6px 0 0;
  background:var(--ng-bg);border-radius:10px;padding:7px 11px;line-height:1.6}
.rv .m::before{content:"✕ "}
.rv .onum{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:rgba(255,255,255,.7);font-size:12px;flex:0 0 auto}
.rv .e{font-size:13px;color:var(--sub);margin:8px 0 0;line-height:1.65}
.logrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 0;border-top:1px solid var(--line);font-size:12.5px}
.logrow:first-of-type{border-top:0}
.logrow .dt{color:var(--sub);font-weight:600}
.logrow .sc{font-weight:800;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.logrow .sc.ok{color:var(--ok)}
.mini{display:flex;gap:14px;margin-top:16px}
.mini button{border:0;background:none;color:var(--sub);font-size:12px;font-weight:700;
  font-family:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0}
.mini button:hover{color:var(--navy2)}
div.warn{margin-top:12px;padding:10px 12px;background:var(--warn-bg);color:#92400E;
  border-radius:10px;font-size:12.5px;line-height:1.6}
.rv .n{font-variant-numeric:tabular-nums}
.onum{font-variant-numeric:tabular-nums}
.foot{font-size:11px;color:#94A3B8;text-align:center;line-height:1.7;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(15,23,42,.5);
  display:flex;align-items:center;justify-content:center;z-index:9999;padding:22px;backdrop-filter:blur(2px)}
.mbox{background:#fff;border-radius:16px;padding:20px 18px;max-width:340px;width:100%;
  box-shadow:var(--shadow-lg)}
.mbox p{margin:0 0 16px;font-size:15px;line-height:1.6;color:var(--ink)}
.mbox .btn{margin-top:9px}
body.locked{overflow:hidden}
body.quizview #hTitle{display:none}
body.quizview header{padding-bottom:8px}
body.quizview .wrap{padding-top:10px}

/* 画面の高さが小さい環境(LINE等のアプリ内ブラウザでツールバー分狭くなる場合など)向けに、
   さらに縦方向の余白を切り詰める。横幅は問わず高さだけで判定する。 */
@media (max-height: 720px) {
  body.quizview header .bar{padding-bottom:2px}
  .card{padding:12px 14px}
  .qphoto{max-height:120px;margin:0 auto 8px}
  .topbar{margin-bottom:7px}
  .opts{margin:8px 0 0;gap:5px}
  .opt{padding:9px 11px}
  .q-main, .q-sub, .opt span, .q, .a, .e{line-height:1.42}
}
@media (max-height: 620px) {
  .qphoto{max-height:88px}
  .card{padding:10px 12px}
  .opt{padding:7px 10px}
}

<script>
/* ===== エラー可視化(診断用) ===== */
(function(){
  function show(msg){
    try{
      var box = document.getElementById('errbox');
      if(!box){
        box = document.createElement('div');
        box.id = 'errbox';
        box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#B91C1C;color:#fff;font-size:12px;line-height:1.5;padding:10px;white-space:pre-wrap;word-break:break-all;max-height:60vh;overflow:auto;';
        document.body.appendChild(box);
      }
      box.textContent += (box.textContent ? '\n---\n' : '') + msg;
    }catch(e){}
  }
  window.addEventListener('error', function(e){
    /* filename・lineno・colnoが全部空の"Script error."は、自分のコード以外(外部注入スクリプト等)由来で
       対処のしようがないノイズなので表示しない。実際に自分のコードのエラーならfilename等が入る。 */
    if((e.message === 'Script error.' || e.message === 'Script error') && !e.filename && !e.lineno && !e.colno) return;
    show('JS Error: ' + (e.message || e) + '\nat ' + (e.filename||'') + ':' + (e.lineno||'') + ':' + (e.colno||''));
  });
  window.addEventListener('unhandledrejection', function(e){
    show('Promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
})();

/* ===== 更新チェック(ホーム画面アイコン経由でも最新に気付けるように) ===== */
(function(){
  var myVer = document.querySelector('meta[name="app-version"]');
  myVer = myVer ? myVer.content : '';
  if(!myVer) return;
  fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function(res){ return res.text(); })
    .then(function(html){
      var m = html.match(/<meta name="app-version" content="([^"]*)"/);
      var liveVer = m ? m[1] : '';
      if(liveVer && liveVer !== myVer){
        var bar = document.createElement('div');
        bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99998;background:#1E4D8C;color:#fff;font-size:13px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 -2px 10px rgba(0,0,0,.15);';
        bar.innerHTML = '<span>新しいバージョンがあります／New version available</span><button style="background:#fff;color:#1E4D8C;border:0;border-radius:8px;padding:6px 12px;font-weight:700;font-size:12.5px;">更新 / Update</button>';
        bar.querySelector('button').onclick = function(){
          location.href = location.pathname + '?v=' + liveVer;
        };
        document.body.appendChild(bar);
      }
    })
    .catch(function(){});
})();
</script>

/* ---------- 記録の保存（保存できない環境では自動的にメモリのみ） ---------- */
const KEY = "ntic_lifeline_v1";
let canSave = true, mem = null;
function blank(){ return {v:1, q:{}, exams:[]}; }
function load(){
  if(mem) return mem;
  try{
    const raw = localStorage.getItem(KEY);
    mem = raw ? JSON.parse(raw) : blank();
  }catch(e){ canSave = false; mem = blank(); }
  return mem;
}
function save(){
  if(!canSave) return;
  try{ localStorage.setItem(KEY, JSON.stringify(mem)); }
  catch(e){ canSave = false; }
}
function recordAnswer(q, ok){
  const st = load();
  const r = st.q[q.id] || (st.q[q.id] = {n:0, c:0, t:0});
  r.n++; if(ok) r.c++; r.t = Date.now();
  save();
}
function recordExam(p, c, n){
  const st = load();
  st.exams.unshift({d:Date.now(), p, c, n, pct:Math.round(c/n*100)});
  st.exams = st.exams.slice(0, 20);
  save();
}
function clearAll(){ mem = blank(); try{ localStorage.removeItem(KEY); }catch(e){} }

/* 統計 */
function stats(){
  const st = load(), all = QG.concat(QJ);
  let n = 0, c = 0, studied = 0;
  const byCat = {};
  all.forEach(q=>{
    const r = st.q[q.id];
    const b = byCat[q.c] || (byCat[q.c] = {n:0, c:0, total:0});
    b.total++;
    if(!r) return;
    studied++; n += r.n; c += r.c; b.n += r.n; b.c += r.c;
  });
  return {n, c, studied, total: all.length, byCat, exams: st.exams,
          pct: n ? Math.round(c/n*100) : 0};
}
/* 4分野のレーダーチャートをSVGで描く（未学習は薄いグレーの点で示す） */
function radarSVG(labels, values){
  const size = 300, cx = size/2, cy = size/2, r = 82;
  const n = labels.length;
  const angle = i => (Math.PI*2*i/n) - Math.PI/2;
  const pt = (i, ratio) => [cx + r*ratio*Math.cos(angle(i)), cy + r*ratio*Math.sin(angle(i))];
  const gridPolys = [0.25,0.5,0.75,1].map(lv=>
    `<polygon points="${labels.map((_,i)=>pt(i,lv).join(",")).join(" ")}" fill="none" stroke="#EEF2F7" stroke-width="1"/>`
  ).join("");
  const axisLines = labels.map((_,i)=>{
    const [x,y] = pt(i,1);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#EEF2F7" stroke-width="1"/>`;
  }).join("");
  const ratios = values.map(v => v===null ? 0 : v/100);
  const dataPoly = `<polygon points="${labels.map((_,i)=>pt(i,ratios[i]).join(",")).join(" ")}"
    fill="rgba(37,99,235,.14)" stroke="#2563EB" stroke-width="2"/>`;
  const dots = labels.map((_,i)=>{
    const [x,y] = pt(i,ratios[i]);
    const none = values[i]===null;
    return `<circle cx="${x}" cy="${y}" r="4" fill="${none?"#CBD5E1":"#2563EB"}" stroke="#fff" stroke-width="1.5"/>`;
  }).join("");
  /* 長いラベルは2行に折り返して、SVG外にはみ出さないようにする。
     日本語は「・」があればそこで分割。英語/インドネシア語/タガログ語などスペース区切りの
     言語は単語単位でバランス良く折り返し、スペースの無い長い単語（"Telekomunikasi"等）は
     文字数で強制的に分割する。 */
  const wrapLabel = (text, maxLen=10) => {
    if(text.includes("・")) return text.split("・").map((s,i,a)=> i<a.length-1 ? s+"・" : s);
    const words = text.split(" ");
    if(words.length===1){
      if(text.length<=maxLen) return [text];
      const mid = Math.ceil(text.length/2);
      return [text.slice(0,mid), text.slice(mid)];
    }
    const lines = []; let cur = "";
    words.forEach(w=>{
      const test = cur ? cur+" "+w : w;
      if(test.length>maxLen && cur){ lines.push(cur); cur = w; } else { cur = test; }
    });
    if(cur) lines.push(cur);
    if(lines.length>2){
      const half = Math.ceil(words.length/2);
      return [words.slice(0,half).join(" "), words.slice(half).join(" ")];
    }
    return lines;
  };
  /* この正答率はあくまで練習モードの学習指標であり、模試の合格ライン(65%)とは
     無関係。ここでは赤/緑などの合否を連想させる色分けはせず、常に中立色で表示する。 */
  const labelTexts = labels.map((lb,i)=>{
    const [x,y] = pt(i, 1.32);
    const val = values[i]===null ? "—" : values[i]+"%";
    const lines = wrapLabel(lb);
    const nameY = y - (lines.length>1 ? 9 : 3);
    const nameTspans = lines.map((ln,li)=>
      `<tspan x="${x}" dy="${li===0?0:12}">${esc(ln)}</tspan>`).join("");
    const valY = nameY + (lines.length>1?12:0) + 15;
    return `<text text-anchor="middle" font-size="11" font-weight="800" fill="#1E293B" y="${nameY}">${nameTspans}</text>
      <text x="${x}" y="${valY}" text-anchor="middle" font-size="11" font-weight="800" fill="#64748B">${val}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:280px;display:block;margin:0 auto;overflow:visible">
    ${gridPolys}${axisLines}${dataPoly}${dots}${labelTexts}
  </svg>`;
}
/* 苦手＝正答率が低い順、未学習は中間扱いで混ぜる */
function weakList(limit){
  const st = load();
  return QG.concat(QJ).map(q=>{
    const r = st.q[q.id];
    /* 未学習は 0.55 = 「半分間違えた問題」より後、「よくできる問題」より先 */
    const rate = r && r.n ? r.c / r.n : 0.55;
    return {q, rate, seen: r ? r.n : 0};
  }).sort((a,b)=> a.rate - b.rate || b.seen - a.seen)
    .slice(0, limit).map(x=>x.q);
}
function exportCsv(){
  try{
  const st = load(), rows = [["id","field","asked","correct","rate"]];
  QG.concat(QJ).forEach(q=>{
    const r = st.q[q.id]; if(!r) return;
    rows.push([q.id, q.c, r.n, r.c, (r.c/r.n).toFixed(2)]);
  });
  rows.push([]); rows.push(["mock_date","part","score","total","pct"]);
  st.exams.forEach(e=> rows.push([new Date(e.d).toISOString().slice(0,10), e.p, e.c, e.n, e.pct]));
  const csv = rows.map(r=>r.join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF"+csv], {type:"text/csv"}));
  a.download = "lifeline_record_" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
  }catch(e){ console.warn("CSV export failed", e); }
}

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* ふりがな対応テキスト描画。｜語句《よみ》の記法(青空文庫式)を<ruby>タグに変換し、
   それ以外の部分は通常どおりescでエスケープする。全角の｜《》を使うため、
   設問文中の全角（　）穴埋め記法とは衝突しない。 */
const rb = s => {
  const str = String(s);
  const re = /｜([^｜《]+)《([^》]+)》/g;
  let out = "", last = 0, m;
  while((m = re.exec(str))){
    out += esc(str.slice(last, m.index));
    out += `<ruby>${esc(m[1])}<rt>${esc(m[2])}</rt></ruby>`;
    last = re.lastIndex;
  }
  out += esc(str.slice(last));
  /* 句点(。)の直後で改行する。ただし文末の句点は対象外(余計な空行を作らないため) */
  return out.replace(/。(?!$)/g, "。<br>");
};
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function ask(msg, okLabel, onOk){
  document.querySelectorAll(".modal").forEach(m=>m.remove());   /* 二重に出さない */
  const d = document.createElement("div");
  d.className = "modal";
  /* CSSが効かない環境でも中央に出るよう、位置だけは直接指定しておく */
  d.style.cssText = "position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;"
    + "background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;padding:22px";
  d.innerHTML = `<div class="mbox"><p>${esc(msg)}</p>
    <button class="btn" id="mok">${esc(okLabel)}</button>
    <button class="btn quiet" id="mng">${esc(tx(T.cancel))}</button></div>`;
  document.body.appendChild(d);
  document.body.classList.add("locked");
  const close = ()=>{ d.remove(); document.body.classList.remove("locked"); };
  d.querySelector("#mok").onclick = ()=>{ close(); onOk(); };
  d.querySelector("#mng").onclick = close;
  d.onclick = e => { if(e.target === d) close(); };
}

  if(w) w.onclick = ()=>{
    mode="practice"; part="g";
    queue = shuffle(weakList(10)); queue.forEach(q=>{q.__ord=null;});
    ans = new Array(queue.length).fill(null);
    idx=0; revealed=false; view="quiz"; render(); window.scrollTo(0,0);
  };
  const ex = document.getElementById("exp");
  if(ex) ex.onclick = exportCsv;
  const rs = document.getElementById("rst");
  if(rs) rs.onclick = ()=>ask(tx(T.resetConfirm), tx(T.resetData), ()=>{ clearAll(); home(); });
}

function begin(m, p, n){
  mode = m; part = p;
  const src = m==="mock" ? pool(p) : pool(p).filter(q=>sel[p].has(q.c));
  queue = shuffle(src);
  if(m==="mock") queue = queue.slice(0, EXAM[p].n);
  else if(n) queue = queue.slice(0, n);
  queue.forEach(q=>{ q.__ord = null; });
  ans = new Array(queue.length).fill(null);
  idx = 0; revealed = false; view = "quiz"; jumpOpen = false;
  timedOut = false;
  if(m==="mock"){ deadline = Date.now() + EXAM[p].sec*1000; }
  render();
  if(m==="mock") startTimer();
  window.scrollTo(0,0);
}

function quiz(){
  const q = queue[idx];
  if(!q.__ord) q.__ord = shuffle(q.o.map((_,i)=>i));
  const isMock = mode==="mock";
  const picked = ans[idx];

  app.innerHTML = `
  <div class="topbar">
    <button class="back" id="back">← ${esc(tx(T.homeShort))}</button>
    <div class="progbar"><i style="width:${((idx+ (picked!=null?1:0))/queue.length)*100}%"></i></div>
    ${isMock
      ? `<button class="progtxt jumpbtn" id="jumpToggle">${idx+1}/${queue.length} ${jumpOpen?"▲":"▼"}</button>`
      : `<div class="progtxt">${idx+1}/${queue.length}</div>`}
    ${isMock ? `<div class="clock" id="clock">${fmt(Math.round((deadline-Date.now())/1000))}</div>` : ""}
  </div>
  ${isMock && jumpOpen ? `
  <div class="jumppanel">
    <div class="grid">
      ${queue.map((_,i)=>`<button data-jump="${i}" class="${i===idx?"now":(ans[i]!=null?"done":"")}">${i+1}</button>`).join("")}
    </div>
  </div>` : ""}
  <div class="card">
    <span class="tag">${esc(tx(CAT[q.c]))}</span>
    ${q.img ? `<img class="qphoto" src="${q.img}" alt="">` : ""}
    ${twin(q.q,"q-main","q-sub")}
    <ul class="opts" id="opts">
      ${q.__ord.map((oi,n)=>{
        let cls = "";
        if(isMock){ if(picked===oi) cls=" picked"; }
        else if(revealed){
          if(oi===q.a) cls=" correct";
          else if(oi===picked) cls=" wrong";
          else cls=" dim";
        }
        return `<li><button class="opt${cls}" data-oi="${oi}" ${(!isMock&&revealed)?"disabled":""}>
          <span class="num">${n+1}</span>${optText(q.o[oi])}</button></li>`;
      }).join("")}
    </ul>
    <div id="fb"></div>
  </div>
  ${isMock ? `
  <div class="nav">
    <button class="btn quiet" id="prev" ${idx===0?"disabled":""}>${esc(tx(T.prev))}</button>
    <button class="btn quiet" id="nextq" ${idx===queue.length-1?"disabled":""}>${esc(tx(T.next))}</button>
  </div>
  <button class="btn warn" id="submit" style="margin-top:10px">${esc(tx(T.submit))}</button>` : ""}`;

  if(isMock){
    document.getElementById("jumpToggle").onclick = ()=>{ jumpOpen = !jumpOpen; render(); };
  }

  app.querySelectorAll(".opt").forEach(b=>b.onclick = ()=>{
    const oi = Number(b.dataset.oi);
    ans[idx] = oi;
    if(isMock){
      if(idx < queue.length-1){ idx++; render(); window.scrollTo(0,0); }
      else render();
    } else {
      recordAnswer(q, oi===q.a);
      revealed = true; render();
      document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
    }
  });

  const goHome = ()=>{ stopTimer(); view="home"; render(); window.scrollTo(0,0); };
  document.getElementById("back").onclick = ()=>{
    if(mode === "mock") ask(tx(T.quitConfirm), tx(T.quit), goHome);
    else goHome();
  };

  if(isMock){
    document.getElementById("prev").onclick = ()=>{ if(idx>0){idx--;render();window.scrollTo(0,0);} };
    document.getElementById("nextq").onclick = ()=>{ if(idx<queue.length-1){idx++;render();window.scrollTo(0,0);} };
    app.querySelectorAll("[data-jump]").forEach(b=>b.onclick = ()=>{ idx=Number(b.dataset.jump); jumpOpen=false; render(); window.scrollTo(0,0); });
    document.getElementById("submit").onclick = ()=>{
      if(ans.includes(null)) ask(tx(T.submitConfirm), tx(T.submit), grade);
      else grade();
    };
  }

  /* 練習モードで回答済みのまま再描画された場合（言語切替など） */
  if(!isMock && revealed && picked!=null){
    const fb = document.getElementById("fb");
    const ok = picked===q.a;
    fb.innerHTML = `
      <div class="verdict ${ok?"ok":"ng"}">
        <div class="head"><span class="mark">${ok?"○":"×"}</span>${esc(ok?tx(T.correct):tx(T.wrong))}</div>
        ${twin(q.e,"","sub")}
      </div>
      <div class="sticky-next-spacer"></div>`;
    const stickyNext2 = document.createElement("div");
    stickyNext2.className = "sticky-next";
    stickyNext2.innerHTML = `<button class="btn" id="cont2">${idx+1<queue.length?esc(tx(T.next)):esc(tx(T.toResult))}</button>`;
    document.body.appendChild(stickyNext2);
    document.getElementById("cont2").onclick = ()=>{
      stickyNext2.remove();
      if(idx+1<queue.length){ idx++; revealed=false; render(); window.scrollTo(0,0); }
      else grade();
    };
    const spacer2 = fb.querySelector(".sticky-next-spacer");
    if(spacer2) spacer2.style.height = stickyNext2.getBoundingClientRect().height + "px";
  }
}

function grade(){
  stopTimer();
  if(mode==="mock"){
    let c = 0;
    queue.forEach((q,i)=>{ const ok = ans[i]===q.a; if(ok) c++; recordAnswer(q, ok); });
    recordExam(part, c, queue.length);
  }
  view="result"; render(); window.scrollTo(0,0);
}

function result(){
  const n = queue.length;
  const c = queue.reduce((s,q,i)=> s + (ans[i]===q.a ? 1:0), 0);
  const pct = Math.round(c/n*100);
  const pass = pct >= 65;
  const wrongIdx = queue.map((q,i)=>i).filter(i=>ans[i]!==queue[i].a);
  /* クイズ画面で実際に表示されていた番号（シャッフル後の表示順）を逆引きする */
  const dispNum = (q, oi) => (q.__ord ? q.__ord.indexOf(oi) : oi) + 1;

  app.innerHTML = `
  <div class="card">
    <div class="score">
      <div class="big">${c}<small> / ${n}</small></div>
      <div class="pct">${pct}%</div>
      ${timedOut?`<div class="pct" style="color:var(--ng);font-weight:700">${esc(tx(T.timeUpNote))}</div>`:""}
      <div class="judge ${pass?"pass":"fail"}">${esc(pass?tx(T.passed):tx(T.failed))}</div>
    </div>
  </div>
  <div class="card">
    <h2>${esc(tx(T.reviewTitle))}${wrongIdx.length?` (${wrongIdx.length})`:""}</h2>
    <ul class="rv">
      ${(wrongIdx.length?wrongIdx:queue.map((_,i)=>i)).map(i=>{
        const q = queue[i];
        return `<li>
          <div class="n">Q${i+1} · ${esc(tx(CAT[q.c]))}</div>
          ${q.img ? `<img class="qphoto" src="${q.img}" alt="">` : ""}
          <p class="q">${rb(q.q[L])}</p>
          <p class="a">${esc(tx(T.answer))}：<b class="onum">${dispNum(q,q.a)}</b>${rb(q.o[q.a][L])}</p>
          ${ans[i]==null
            ? `<p class="m">${esc(tx(T.noAns))}</p>`
            : (ans[i]!==q.a ? `<p class="m">${esc(tx(T.yours))}：<b class="onum">${dispNum(q,ans[i])}</b>${rb(q.o[ans[i]][L])}</p>` : "")}
          <p class="e">${rb(q.e[L])}</p>
        </li>`;
      }).join("")}
    </ul>
  </div>
  <div class="card">
    ${wrongIdx.length?`<button class="btn" id="rw">${esc(tx(T.wrongOnly))} (${wrongIdx.length})</button>`:""}
    <button class="btn ${wrongIdx.length?"ghost":""}" id="ag">${esc(tx(T.again))}</button>
    <button class="btn quiet" id="hm">${esc(tx(T.home))}</button>
  </div>`;

  const restart = list => {
    queue = shuffle(list); queue.forEach(q=>{q.__ord=null;});
    ans = new Array(queue.length).fill(null);
    idx = 0; revealed = false; mode = "practice"; view = "quiz";
    render(); window.scrollTo(0,0);
  };
  if(wrongIdx.length) document.getElementById("rw").onclick = ()=>restart(wrongIdx.map(i=>queue[i]));
  document.getElementById("ag").onclick = ()=>{
    const keep = queue.slice();
    if(mode==="mock"){ begin("mock", part, 0); } else { restart(keep); }
  };
  document.getElementById("hm").onclick = ()=>{ view="home"; render(); window.scrollTo(0,0); };
}

render();
</script>
</body>
</html>
