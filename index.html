<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ライフラインクイズ</title>
<style>
  :root {
    --primary: #2563EB;
    --primary-hover: #1D4ED8;
    --bg-main: #F8FAFC;
    --card-bg: #FFFFFF;
    --text-main: #1E293B;
    --text-sub: #64748B;
    --border: #E2E8F0;
    --correct: #16A34A;
    --incorrect: #DC2626;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Yu Gothic UI", "Meiryo", sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
    line-height: 1.6;
    padding-bottom: 40px;
  }
  header {
    background: #FFFFFF;
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-logo { height: 28px; }
  .lang-selector button {
    background: none;
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    margin-left: 4px;
  }
  .lang-selector button.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .container { max-width: 800px; margin: 20px auto; padding: 0 16px; }
  .tabs { display: flex; gap: 8px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
  .tab-btn {
    flex: 1; padding: 12px; text-align: center; font-weight: bold;
    border: none; background: none; cursor: pointer; color: var(--text-sub);
    border-bottom: 3px solid transparent; margin-bottom: -2px;
  }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
  
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat { text-align: center; padding: 16px; background: #F1F5F9; border-radius: 8px; }
  .stat-val { font-size: 24px; font-weight: bold; color: var(--primary); font-feature-settings: "tnum"; }
  .stat-lbl { font-size: 12px; color: var(--text-sub); }

  .radar-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 600px) { .radar-grid { grid-template-columns: 1fr; } }
  .radar-box { text-align: center; }

  .logrow {
    display: flex; justify-content: space-between; padding: 8px 0;
    border-bottom: 1px solid var(--border); font-feature-settings: "tnum";
  }

  .btn-primary {
    display: block; width: 100%; padding: 14px; background: var(--primary);
    color: white; border: none; border-radius: 8px; font-weight: bold;
    cursor: pointer; text-align: center; transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--primary-hover); }
</style>
</head>
<body>

<header>
  <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" alt="Logo" class="header-logo" id="appLogo">
  <div class="lang-selector">
    <button onclick="setLang('ja')" id="btn-ja" class="active">日本語</button>
    <button onclick="setLang('en')" id="btn-en">EN</button>
    <button onclick="setLang('id')" id="btn-id">ID</button>
    <button onclick="setLang('tl')" id="btn-tl">TL</button>
  </div>
</header>

<div class="container">
  <nav class="tabs">
    <button class="tab-btn active" onclick="switchTab('record')">記録</button>
    <button class="tab-btn" onclick="switchTab('practice')">練習</button>
    <button class="tab-btn" onclick="switchTab('mock')">模試</button>
  </nav>

  <main id="app-content">
    <!-- コンテンツ動的描写エリア -->
  </main>
</div>

<script>
let L = 'ja';

function esc(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ★最新修正版 radarSVG 関数 */
function radarSVG(labels, values){
  const size = 328, cx = size/2, cy = size/2, r = 80;   // ① SVGサイズを300→328に拡大し余白を確保
  const n = labels.length;
  const angle = i => (Math.PI*2*i/n) - Math.PI/2;
  const pt = (i, ratio) => [cx + r*ratio*Math.cos(angle(i)), cy + r*ratio*Math.sin(angle(i))];

  // グリッド線・軸線
  let grid = '';
  [0.25, 0.5, 0.75, 1.0].forEach(level => {
    const pts = labels.map((_, i) => pt(i, level).join(',')).join(' ');
    grid += `<polygon points="${pts}" fill="none" stroke="#E2E8F0" stroke-width="1"/>`;
  });
  labels.forEach((_, i) => {
    const [x2, y2] = pt(i, 1.0);
    grid += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#E2E8F0" stroke-width="1"/>`;
  });

  // データ多角形
  const dataPts = values.map((v, i) => {
    const val = v === null ? 0 : v / 100;
    return pt(i, val).join(',');
  }).join(' ');
  const polygon = `<polygon points="${dataPts}" fill="rgba(37, 99, 235, 0.2)" stroke="#2563EB" stroke-width="2"/>`;

  /* 言語を問わずラベルを最大2行に折り返す。
     「・」があればそこで分割（日本語）。無ければ単語（スペース区切り）を
     文字数バランスが良くなる位置で折り返し、スペースの無い長い単語は文字数で強制分割する。 */
  const wrapLabel = (text, maxLen=10) => {
    if(text.includes("・")) return text.split("・").map((s,i,a)=> i<a.length-1 ? s+"・" : s);
    const words = text.split(" ");
    if(words.length===1){
      if(text.length<=maxLen) return [text];
      const mid = Math.ceil(text.length/2);
      return [text.slice(0,mid), text.slice(mid)];
    }
    const lines = []; let cur = "";
    words.forEach(w=>{
      const test = cur ? cur+" "+w : w;
      if(test.length>maxLen && cur){ lines.push(cur); cur = w; } else { cur = test; }
    });
    if(cur) lines.push(cur);
    if(lines.length>2){
      const half = Math.ceil(words.length/2);
      return [words.slice(0,half).join(" "), words.slice(half).join(" ")];
    }
    return lines;
  };

  const labelTexts = labels.map((lb,i)=>{
    const [x,y] = pt(i, 1.34);   // ② ラベル位置係数を1.32→1.34に微調整
    const val = values[i]===null ? "—" : values[i]+"%";
    const low = values[i]!==null && values[i]<65;
    const lines = wrapLabel(lb);
    const nameY = y - (lines.length>1 ? 9 : 3);
    const nameTspans = lines.map((ln,li)=>
      `<tspan x="${x}" dy="${li===0?0:12}">${esc(ln)}</tspan>`).join("");
    const valY = nameY + (lines.length>1?12:0) + 15;
    return `<text text-anchor="middle" font-size="11" font-weight="800" fill="#1E293B" y="${nameY}">${nameTspans}</text>
      <text x="${x}" y="${valY}" text-anchor="middle" font-size="11" font-weight="800" fill="${low?"#DC2626":"#64748B"}">${val}</text>`;
  }).join("");

  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="auto" style="max-width:${size}px;">
    ${grid}
    ${polygon}
    ${labelTexts}
  </svg>`;
}

function renderRecordView() {
  const labels学科 = ["回路・基礎", "安全衛生", "施工管理", "法令・現場のルール"];
  const values学科 = [0, 0, 0, 0];
  const labels実技 = ["器具・工具", "測定・試験", "安全作業", "施工法"];
  const values実技 = [0, 0, 0, 0];

  document.getElementById('app-content').innerHTML = `
    <div class="card">
      <h2>学習の記録</h2>
      <div class="kpi-grid" style="margin-top: 15px;">
        <div class="stat"><div class="stat-val">30/140</div><div class="stat-lbl">学習ずみ</div></div>
        <div class="stat"><div class="stat-val">0%</div><div class="stat-lbl">正答率</div></div>
        <div class="stat"><div class="stat-val">30</div><div class="stat-lbl">回</div></div>
      </div>
      
      <h3>分野別の正答率</h3>
      <div class="radar-grid" style="margin-top: 15px;">
        <div class="radar-box">
          <h4>学科</h4>
          ${radarSVG(labels学科, values学科)}
        </div>
        <div class="radar-box">
          <h4>実技</h4>
          ${radarSVG(labels実技, values実技)}
        </div>
      </div>
      <button class="btn-primary" style="margin-top: 20px;">苦手なところを練習する</button>
    </div>

    <div class="card">
      <h3>模試の記録</h3>
      <div class="logrow">
        <span>2026/8/3・学科</span>
        <span>0/30 0%</span>
      </div>
    </div>
  `;
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (event) event.target.classList.add('active');
  if (tab === 'record') renderRecordView();
}

function setLang(lang) {
  L = lang;
  document.querySelectorAll('.lang-selector button').forEach(b => b.classList.remove('active'));
  document.getElementById(`btn-${lang}`).classList.add('active');
  renderRecordView();
}

// 初期化表示
renderRecordView();
</script>
</body>
</html>
