<title>ライフライン・設備 学習 | Lifeline &amp; Equipment</title>
<style>
:root{
  --navy:#0F2E52; --navy2:#1E4D8C; --yellow:#F2C230;
  --ok:#12795A; --ng:#C0392B;
  --bg:#EDF1F6; --card:#FFFFFF; --line:#D7DEE7;
  --ink:#16222F; --sub:#5E6C7C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,-apple-system,sans-serif;
  line-height:1.6; font-size:16px;
  padding-bottom:env(safe-area-inset-bottom);
}
header{background:var(--navy);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:10}
@supports (padding-top: env(safe-area-inset-top)){
  header{padding-top:calc(12px + env(safe-area-inset-top))}
}
header .bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
header .logo{height:23px;width:auto;display:block;flex:0 0 auto}
header h1{margin:7px 0 0;font-size:13.5px;font-weight:700;letter-spacing:.02em;opacity:.92}
.stripe{height:5px;background:repeating-linear-gradient(115deg,var(--yellow) 0 14px,#0F2E52 14px 28px)}
.langbtns{display:flex;background:rgba(255,255,255,.13);border-radius:8px;padding:3px}
.langbtns button{border:0;background:transparent;color:#fff;font-size:12px;font-weight:600;
  padding:6px 8px;border-radius:6px;cursor:pointer;font-family:inherit}
.langbtns button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 44px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:14px}
.card.exam{border-color:var(--navy2);border-width:1.5px}
.lead{font-size:12.5px;color:var(--sub);margin:0 0 4px;letter-spacing:.03em}
h2{font-size:18px;margin:0 0 4px;letter-spacing:.01em}
.desc{font-size:13.5px;color:var(--sub);margin:6px 0 0}

.spec{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.spec div{flex:1;min-width:76px;background:#F3F6FA;border-radius:9px;padding:9px 10px;text-align:center}
.spec b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.spec span{font-size:10.5px;color:var(--sub)}

.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;
  background:var(--navy2);color:#fff;font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:11px}
.btn:disabled{background:#A9B6C4}
.btn.ghost{background:#fff;color:var(--navy2);border:1.5px solid var(--navy2)}
.btn.quiet{background:#fff;color:var(--sub);border:1.5px solid var(--line);font-weight:600;font-size:14px;padding:12px}
.btn.warn{background:var(--yellow);color:#3B2C00}

.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
.cat{display:flex;flex-direction:column;gap:1px;align-items:flex-start;border:1.5px solid var(--line);
  background:#fff;border-radius:11px;padding:10px 11px;cursor:pointer;text-align:left;color:var(--ink);font-family:inherit}
.cat[aria-pressed="true"]{border-color:var(--navy2);background:#EAF1FA}
.cat b{font-size:13.5px;font-weight:700}
.cat span{font-size:10.5px;color:var(--sub)}

.topbar{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.back{flex:0 0 auto;border:1.5px solid var(--navy2);background:#fff;color:var(--navy2);
  border-radius:9px;padding:6px 11px;font-family:inherit;font-size:13px;font-weight:700;
  cursor:pointer;line-height:1.4;white-space:nowrap}
.progbar{flex:1;height:7px;background:#DDE4EC;border-radius:99px;overflow:hidden}
.progbar i{display:block;height:100%;background:var(--navy2);border-radius:99px;transition:width .2s}
.progtxt{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;font-weight:700}
.clock{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;background:#fff;
  border:1.5px solid var(--line);border-radius:8px;padding:5px 9px;color:var(--navy)}
.clock.hurry{border-color:var(--ng);color:var(--ng)}

.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;
  background:#EAF1FA;color:var(--navy2);border-radius:5px;padding:3px 8px;margin-bottom:10px}
.q-main{font-size:17.5px;font-weight:700;line-height:1.55;margin:0 0 6px}
.q-sub{font-size:13.5px;color:var(--sub);margin:0;line-height:1.5}

.opts{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.opt{width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:11px;
  padding:12px 13px;font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer;
  display:flex;gap:11px;align-items:flex-start;line-height:1.45}
.opt .num{flex:0 0 24px;height:24px;border-radius:6px;background:#EEF2F7;color:var(--sub);
  display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px}
.opt .sub{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
.opt.picked{border-color:var(--navy2);background:#EAF1FA}
.opt.picked .num{background:var(--navy2);color:#fff}
.opt.correct{border-color:var(--ok);background:#EAF6F1}
.opt.correct .num{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ng);background:#FBEDEB}
.opt.wrong .num{background:var(--ng);color:#fff}
.opt.dim{opacity:.5}

.verdict{margin-top:15px;border-radius:12px;padding:13px;border:1.5px solid}
.verdict.ok{border-color:var(--ok);background:#EAF6F1}
.verdict.ng{border-color:var(--ng);background:#FBEDEB}
.verdict .head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14.5px;margin-bottom:6px}
.verdict.ok .head{color:var(--ok)}
.verdict.ng .head{color:var(--ng)}
.verdict .mark{font-size:19px;line-height:1}
.verdict p{margin:0 0 4px;font-size:14px}
.verdict .sub{font-size:12.5px;color:var(--sub);margin:0}

.nav{display:flex;gap:9px;margin-top:12px}
.nav button{flex:1}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.grid button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:9px 0;
  font-family:inherit;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;font-variant-numeric:tabular-nums}
.grid button.done{border-color:var(--navy2);background:#EAF1FA;color:var(--navy2)}
.grid button.now{background:var(--navy2);border-color:var(--navy2);color:#fff}

.score{text-align:center;padding:6px 0 2px}
.score .big{font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:19px;font-weight:700;color:var(--sub)}
.score .pct{font-size:13.5px;color:var(--sub);margin-top:6px}
.judge{display:inline-block;margin-top:12px;font-weight:800;font-size:14px;padding:6px 16px;border-radius:99px}
.judge.pass{background:#EAF6F1;color:var(--ok)}
.judge.fail{background:#FFF6E3;color:#8A6100}

.rv{list-style:none;margin:0;padding:0}
.rv li{border-top:2px solid var(--bg);padding:16px 0;background:#fff}
.rv li:first-child{border-top:0}
.rv .n{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;
  color:#fff;background:var(--navy);padding:3px 10px 3px 8px;border-radius:99px;letter-spacing:.02em}
.rv .q{font-size:15px;font-weight:700;margin:9px 0 6px;line-height:1.5}
.rv .a{font-size:13.5px;color:var(--ok);font-weight:700;margin:0;
  background:#EAF6F1;border-radius:8px;padding:6px 10px;display:block}
.rv .a::before{content:"✓ "}
.rv .m{font-size:13px;color:var(--ng);font-weight:700;margin:6px 0 0;
  background:#FDF3F2;border-radius:8px;padding:6px 10px;display:block}
.rv .m::before{content:"✕ "}
.rv .e{font-size:13px;color:var(--sub);margin:8px 0 0;line-height:1.6}
.foot{font-size:11px;color:#8894A2;text-align:center;line-height:1.7;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,20,35,.55);
  display:flex;align-items:center;justify-content:center;z-index:9999;padding:22px}
.mbox{background:#fff;border-radius:14px;padding:20px 18px;max-width:340px;width:100%;
  box-shadow:0 10px 34px rgba(0,0,0,.3)}
.mbox p{margin:0 0 16px;font-size:15px;line-height:1.6}
.mbox .btn{margin-top:9px}
body.locked{overflow:hidden}
</style>

[[QG,TL_G],[QJ,TL_J]].forEach(([arr,tr])=>{
  arr.forEach((q,i)=>{
    const t = tr[i];
    if(!t){ q.q.push(q.q[1]); q.e.push(q.e[1]); q.o.forEach(o=>o.push(o[1])); return; }

    q.o.forEach((o,k)=>o.push(t.o[k] || o[1]));
  });
});

/* ---------- 記録の保存（保存できない環境では自動的にメモリのみ） ---------- */
const KEY = "ntic_lifeline_v1";
let canSave = true, mem = null;
function blank(){ return {v:1, q:{}, exams:[]}; }
function load(){
  if(mem) return mem;
  try{
    const raw = localStorage.getItem(KEY);
    mem = raw ? JSON.parse(raw) : blank();
  }catch(e){ canSave = false; mem = blank(); }
  return mem;
}
function save(){
  if(!canSave) return;
  try{ localStorage.setItem(KEY, JSON.stringify(mem)); }
  catch(e){ canSave = false; }
}
function recordAnswer(q, ok){
  const st = load();
  const r = st.q[q.id] || (st.q[q.id] = {n:0, c:0, t:0});
  r.n++; if(ok) r.c++; r.t = Date.now();
  save();
}
function recordExam(p, c, n){
  const st = load();
  st.exams.unshift({d:Date.now(), p, c, n, pct:Math.round(c/n*100)});
  st.exams = st.exams.slice(0, 20);
  save();
}
function clearAll(){ mem = blank(); try{ localStorage.removeItem(KEY); }catch(e){} }

/* 統計 */
function stats(){
  const st = load(), all = QG.concat(QJ);
  let n = 0, c = 0, studied = 0;
  const byCat = {};
  all.forEach(q=>{
    const r = st.q[q.id];
    const b = byCat[q.c] || (byCat[q.c] = {n:0, c:0, total:0});
    b.total++;
    if(!r) return;
    studied++; n += r.n; c += r.c; b.n += r.n; b.c += r.c;
  });
  return {n, c, studied, total: all.length, byCat, exams: st.exams,
          pct: n ? Math.round(c/n*100) : 0};
}
/* 苦手＝正答率が低い順、未学習は中間扱いで混ぜる */
function weakList(limit){
  const st = load();
  return QG.concat(QJ).map(q=>{
    const r = st.q[q.id];
    /* 未学習は 0.55 = 「半分間違えた問題」より後、「よくできる問題」より先 */
    const rate = r && r.n ? r.c / r.n : 0.55;
    return {q, rate, seen: r ? r.n : 0};
  }).sort((a,b)=> a.rate - b.rate || b.seen - a.seen)
    .slice(0, limit).map(x=>x.q);
}
function exportCsv(){
  try{
  const st = load(), rows = [["id","field","asked","correct","rate"]];
  QG.concat(QJ).forEach(q=>{
    const r = st.q[q.id]; if(!r) return;
    rows.push([q.id, q.c, r.n, r.c, (r.c/r.n).toFixed(2)]);
  });
  rows.push([]); rows.push(["mock_date","part","score","total","pct"]);
  st.exams.forEach(e=> rows.push([new Date(e.d).toISOString().slice(0,10), e.p, e.c, e.n, e.pct]));
  const csv = rows.map(r=>r.join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF"+csv], {type:"text/csv"}));
  a.download = "lifeline_record_" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
  }catch(e){ console.warn("CSV export failed", e); }
}

function twin(arr, cMain, cSub){

  if(L!==0 && withJa) h += `<p class="${cSub}">${esc(arr[0])}</p>`;

function fmt(sec){

  const m = Math.floor(sec/60), s = sec%60;

}

/* ---------- 確認ダイアログ（ブラウザのconfirmは環境によって効かないため自前で） ---------- */
function ask(msg, okLabel, onOk){
  document.querySelectorAll(".modal").forEach(m=>m.remove());   /* 二重に出さない */
  const d = document.createElement("div");
  d.className = "modal";
  /* CSSが効かない環境でも中央に出るよう、位置だけは直接指定しておく */
  d.style.cssText = "position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;"
    + "background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;padding:22px";
  d.innerHTML = `<div class="mbox"><p>${esc(msg)}</p>
    <button class="btn" id="mok">${esc(okLabel)}</button>
    <button class="btn quiet" id="mng">${esc(tx(T.cancel))}</button></div>`;
  document.body.appendChild(d);
  document.body.classList.add("locked");
  const close = ()=>{ d.remove(); document.body.classList.remove("locked"); };
  d.querySelector("#mok").onclick = ()=>{ close(); onOk(); };
  d.querySelector("#mng").onclick = close;
  d.onclick = e => { if(e.target === d) close(); };
}

function begin(m, p, n){
  mode = m; part = p;
  const src = m==="mock" ? pool(p) : pool(p).filter(q=>sel[p].has(q.c));
  queue = shuffle(src);
  if(m==="mock") queue = queue.slice(0, EXAM[p].n);
  else if(n) queue = queue.slice(0, n);
  queue.forEach(q=>{ q.__ord = null; });
  ans = new Array(queue.length).fill(null);
  idx = 0; revealed = false; view = "quiz";
  timedOut = false;
  if(m==="mock"){ deadline = Date.now() + EXAM[p].sec*1000; }
  render();
  if(m==="mock") startTimer();
  window.scrollTo(0,0);
}

function grade(){
  stopTimer();
  if(mode==="mock"){
    let c = 0;
    queue.forEach((q,i)=>{ const ok = ans[i]===q.a; if(ok) c++; recordAnswer(q, ok); });
    recordExam(part, c, queue.length);
  }
  view="result"; render(); window.scrollTo(0,0);
}

  };
  if(wrongIdx.length) document.getElementById("rw").onclick = ()=>restart(wrongIdx.map(i=>queue[i]));
  document.getElementById("ag").onclick = ()=>{
    const keep = queue.slice();
    if(mode==="mock"){ begin("mock", part, 0); } else { restart(keep); }
  };
  document.getElementById("hm").onclick = ()=>{ view="home"; render(); window.scrollTo(0,0); };
}

render();
</script>
</body>
</html>
